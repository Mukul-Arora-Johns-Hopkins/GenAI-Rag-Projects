[project]
name = "pdf-qa-assistant"
version = "1.0.0"
description = "PDF Q&A Assistant — local-first RAG with Ollama + Chroma"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pdfplumber>=0.10.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
pdf-qa = "pdf_qa.main:run"

[tool.setuptools.packages.find]
include = ["pdf_qa*"]
