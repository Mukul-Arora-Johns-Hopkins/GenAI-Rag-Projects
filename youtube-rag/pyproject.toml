[project]
name = "youtube-rag-assistant"
version = "1.0.0"
description = "YouTube Research Assistant — transcript-based RAG with Ollama + Chroma"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "youtube-transcript-api>=1.3.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
youtube-rag = "youtube_rag.main:run"

[tool.setuptools.packages.find]
include = ["youtube_rag*"]
